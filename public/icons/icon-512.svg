<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tavolyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="tavolyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tavolyDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#tavolyBg)"/>
  <rect width="512" height="256" rx="115" fill="url(#tavolyGlow)"/>

  <!-- Icona Cloche & Posate Gourmet -->
  <g filter="url(#tavolyDrop)" transform="translate(256, 256)">
    <!-- Vassoio / Piatto di portata base -->
    <rect x="-155" y="75" width="310" height="18" rx="9" fill="#ffffff"/>
    <path d="M-125 93 L125 93 L100 110 L-100 110 Z" fill="#ffffff" fill-opacity="0.6"/>

    <!-- Cupola Cloche Ristorante -->
    <path d="M-135 60 C-135 -50 135 -50 135 60 Z" fill="#ffffff"/>
    <!-- Pomello della cloche -->
    <circle cx="0" cy="-65" r="22" fill="#ffffff"/>
    <rect x="-8" y="-48" width="16" height="15" rx="4" fill="#ffffff"/>

    <!-- Luce riflesso curva su cloche -->
    <path d="M-95 45 C-95 -20 -20 -35 -20 -35 C-20 -35 -75 -10 -75 45 Z" fill="#059669" fill-opacity="0.25"/>

    <!-- Forchetta a sinistra e Coltello a destra eleganti -->
    <g transform="translate(0, -95)">
      <!-- Scintille di gusto / aroma fumante -->
      <path d="M-25 -25 C-35 -40 -15 -55 -25 -70" stroke="#ecfdf5" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M0 -30 C-10 -48 10 -65 0 -82" stroke="#ecfdf5" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M25 -25 C15 -40 35 -55 25 -70" stroke="#ecfdf5" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>