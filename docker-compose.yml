version: "3.8"

services:
  tavoly-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tavoly_${SUBDOMAIN:-demo}
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/data/tavoly.db
      - TAAAAC_CORE_URL=https://taaaac.eu
      - TAAAAC_DOMAIN=${SUBDOMAIN:-demo}.taaaac.eu
      - TAAAAC_TOKEN=${TAAAAC_TOKEN:-demo-secret-token}
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - tavoly_data:/app/data
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tavoly-${SUBDOMAIN:-demo}.rule=Host(`${SUBDOMAIN:-demo}.taaaac.eu`)"
      - "traefik.http.routers.tavoly-${SUBDOMAIN:-demo}.entrypoints=websecure"
      - "traefik.http.routers.tavoly-${SUBDOMAIN:-demo}.tls.certresolver=letsencrypt"
      - "traefik.http.services.tavoly-${SUBDOMAIN:-demo}.loadbalancer.server.port=3000"

volumes:
  tavoly_data:
    name: tavoly_data_${SUBDOMAIN:-demo}

networks:
  traefik-net:
    external: true
