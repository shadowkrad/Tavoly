services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    ports:
      - "${PORT_BIND:-3002}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/app.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${TENANT_DOMAIN:-tavoly.taaaac.eu}}
      - TAAAAC_TENANT_DOMAIN=${TENANT_DOMAIN:-tavoly.taaaac.eu}
      - TAAAAC_CORE_API_URL=${TAAAAC_CORE_API_URL:-https://taaaac.eu}
    volumes:
      - tavoly_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=taaaac-network"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}-http.rule=Host(`${TENANT_DOMAIN:-tavoly.taaaac.eu}`)"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}-http.entrypoints=web"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}-http.middlewares=redirect-to-https@docker"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}.rule=Host(`${TENANT_DOMAIN:-tavoly.taaaac.eu}`)"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}.entrypoints=websecure"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}.tls=true"
      - "traefik.http.routers.tavoly-${TENANT_ID:-demo}.tls.certresolver=letsencrypt"
      - "traefik.http.services.tavoly-${TENANT_ID:-demo}.loadbalancer.server.port=3000"
    networks:
      - default
      - taaaac-network

volumes:
  tavoly_data:

networks:
  default:
  taaaac-network:
    external: true
